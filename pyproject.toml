[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recognition-accuracy"
version = "0.1.0"
description = "Reproducible LFW alignment and MobileFaceNet evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "gdown>=5.2,<6",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.20,<2"]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.21,<2"]
test = ["pytest>=8,<10", "onnx>=1.16,<2", "ruff>=0.9"]

[project.scripts]
face-accuracy = "recognition_accuracy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
